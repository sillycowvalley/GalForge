# A tag such as v1.0.0 builds single-file executables and attaches them to
# a GitHub Release of that name.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test GalForge.sln -c Release
      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/GalForge/GalForge.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version="$version" -o "out/$rid"
          done
          mkdir dist
          cp out/win-x64/galforge.exe "dist/galforge-$version-win-x64.exe"
          cp out/linux-x64/galforge "dist/galforge-$version-linux-x64"
          cp out/osx-arm64/galforge "dist/galforge-$version-osx-arm64"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "GalForge $GITHUB_REF_NAME" --generate-notes
